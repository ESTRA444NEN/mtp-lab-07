name: Python and PostgreSQL checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lab7
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lab7"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LAB7_PG_DSN: postgresql://postgres:postgres@localhost:5432/lab7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
